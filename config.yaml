refresh:
  timezone: Asia/Shanghai
  daily_reset_hour: 11

routing:
  default_level: 1
  fallback_enabled: true
  max_fallback_level: 5

providers:
  xiaomi_mimo:
    type: openai_compatible
    stream_usage_mode: parse_only
    endpoints:
      token_plan:
        base_url: ${MIMO_TOKEN_PLAN_BASE_URL}
        auth_header: api_key
        stream_usage_mode: no_option_usage_chunk
        keys:
          - id: mimo_token_plan
            value: ${MIMO_TOKEN_PLAN_KEY}
      # Future extension example: keep commented until you have a separate API key.
      # api:
      #   base_url: ${MIMO_API_BASE_URL}
      #   auth_header: api_key
      #   keys:
      #     - id: mimo_api
      #       value: ${MIMO_API_KEY}

  volcengine_ark:
    type: openai_compatible
    stream_usage_mode: ark_include_usage
    endpoints:
      api:
        base_url: ${ARK_BASE_URL}
        auth_header: authorization_bearer
        keys:
          - id: volcengine_ark_1
            value: ${ARK_API_KEY}

  openrouter:
    type: openai_compatible
    stream_usage_mode: no_option_usage_chunk
    endpoints:
      api:
        base_url: ${OPENROUTER_BASE_URL}
        auth_header: authorization_bearer
        keys:
          - id: openrouter_1
            value: ${OPENROUTER_API_KEY}
          - id: openrouter_2
            value: ${OPENROUTER_API_KEY_2}

model_instances:
  - name: mimo-v2.5-pro
    provider: xiaomi_mimo
    endpoint: token_plan
    level: 1
    keys:
      - key_id: mimo_token_plan
        daily_quota: 50000000
        priority: 10
    groups: [coding, general]

  - name: doubao-seed-2-0-pro-260215
    provider: volcengine_ark
    endpoint: api
    level: 1
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 20
    groups: [reasoning, general]

  - name: doubao-seed-2-0-code-preview-260215
    provider: volcengine_ark
    endpoint: api
    level: 1
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 30
    groups: [reasoning, coding, general]

  - name: volcengine/glm-4-7-251222
    provider: volcengine_ark
    endpoint: api
    level: 1
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 60
    groups: [general, fallback]

  - name: volcengine/deepseek-v3-2-251201
    provider: volcengine_ark
    endpoint: api
    level: 1
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 70
    groups: [general, coding, fallback]

  - name: doubao-seed-2-0-lite-260428
    provider: volcengine_ark
    endpoint: api
    level: 2
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 40
    groups: [reasoning, general, fallback]

  - name: doubao-seed-2-0-mini-260428
    provider: volcengine_ark
    endpoint: api
    level: 3
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1600000
        priority: 50
    groups: [reasoning, general, fallback]

  - name: ${OPENROUTER_FREE_MODEL}
    provider: openrouter
    endpoint: api
    level: 5
    keys:
      - key_id: openrouter_1
        daily_quota: 4000000
        daily_request_quota: 40
        priority: 100
      - key_id: openrouter_2
        daily_quota: 4500000
        daily_request_quota: 45
        priority: 110
    groups: [general, coding, fallback, free]
