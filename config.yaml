refresh:
  timezone: Asia/Shanghai
  daily_reset_hour: 11

routing:
  default_level: 1
  fallback_enabled: true
  max_fallback_level: 5
  runtime_cooldown_seconds: 30

providers:
  volcengine_ark:
    type: openai_compatible
    stream_usage_mode: ark_include_usage
    endpoints:
      api:
        base_url: ${ARK_BASE_URL}
        auth_header: authorization_bearer
        responses_api: native
        responses_unsupported_tool_types: [custom]
        keys:
          - id: volcengine_ark_1
            value: ${ARK_API_KEY}
          - id: volcengine_ark_2
            value: ${ARK_API_KEY_2}
          - id: volcengine_ark_payg
            value: ${ARK_PAYG_API_KEY}

  agnes:
    type: openai_compatible
    stream_usage_mode: openai_include_usage
    endpoints:
      api:
        base_url: ${AGNES_BASE_URL}
        auth_header: authorization_bearer
        keys:
          - id: agnes_1
            value: ${AGNES_API_KEY}

  openrouter:
    type: openai_compatible
    stream_usage_mode: no_option_usage_chunk
    endpoints:
      api:
        base_url: ${OPENROUTER_BASE_URL}
        auth_header: authorization_bearer
        responses_api: native
        keys:
          - id: openrouter_1
            value: ${OPENROUTER_API_KEY}
          - id: openrouter_2
            value: ${OPENROUTER_API_KEY_2}

model_instances:
  - name: payg/doubao-seed-2-1-turbo-260628
    upstream_model: doubao-seed-2-1-turbo-260628
    provider: volcengine_ark
    endpoint: api
    level: 1
    max_concurrency: 8
    requires_explicit_model: true
    keys:
      - key_id: volcengine_ark_payg
        daily_quota: 10000000
        priority: 10
    groups: [reasoning, general]

  - name: payg/doubao-seed-2-1-pro-260628
    upstream_model: doubao-seed-2-1-pro-260628
    provider: volcengine_ark
    endpoint: api
    level: 1
    max_concurrency: 8
    requires_explicit_model: true
    keys:
      - key_id: volcengine_ark_payg
        daily_quota: 10000000
        priority: 10
    groups: [reasoning, general]

  - name: doubao-seed-2-1-pro-260628
    provider: volcengine_ark
    endpoint: api
    level: 1
    max_concurrency: 4
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1800000
        quota_refresh_mode: delayed_calendar_day
        priority: 10
      - key_id: volcengine_ark_2
        daily_quota: 1800000
        quota_refresh_mode: delayed_calendar_day
        priority: 10
    groups: [reasoning, general]

  - name: doubao-seed-2-1-turbo-260628
    provider: volcengine_ark
    endpoint: api
    level: 1
    max_concurrency: 4
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 1800000
