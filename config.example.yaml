refresh:
  timezone: Asia/Shanghai
  daily_reset_hour: 11

routing:
  default_level: 1
  fallback_enabled: true
  max_fallback_level: 5

providers:
  xiaomi_mimo:
    type: openai_compatible
    base_url: ${MIMO_BASE_URL}
    auth_header: api_key
    keys:
      - id: mimo_code_plan
        value: ${MIMO_TOKEN_PLAN_KEY}

  volcengine_ark:
    type: openai_compatible
    base_url: ${VOLCENGINE_ARK_BASE_URL}
    auth_header: authorization_bearer
    keys:
      - id: volcengine_ark_1
        value: ${VOLCENGINE_ARK_API_KEY}

model_instances:
  - name: ${MIMO_MODEL}
    provider: xiaomi_mimo
    key_id: mimo_code_plan
    level: 1
    daily_quota: 50000000
    priority: 10
    groups: [coding, general]

  - name: ${VOLCENGINE_ARK_MODEL}
    provider: volcengine_ark
    key_id: volcengine_ark_1
    level: 2
    daily_quota: 50000000
    priority: 20
    groups: [general, coding, fallback]
