refresh:
  timezone: Asia/Shanghai
  daily_reset_hour: 11

routing:
  default_level: 1
  fallback_enabled: true
  max_fallback_level: 5
  runtime_cooldown_seconds: 30

providers:
  xiaomi_mimo:
    type: openai_compatible
    stream_usage_mode: parse_only
    endpoints:
      token_plan:
        base_url: ${MIMO_TOKEN_PLAN_BASE_URL}
        auth_header: api_key
        stream_usage_mode: no_option_usage_chunk
        keys:
          - id: mimo_token_plan
            value: ${MIMO_TOKEN_PLAN_KEY}
      # Future extension example: keep commented until you have a separate API key.
      # api:
      #   base_url: ${MIMO_API_BASE_URL}
      #   auth_header: api_key
      #   keys:
      #     - id: mimo_api
      #       value: ${MIMO_API_KEY}

  volcengine_ark:
    type: openai_compatible
    stream_usage_mode: ark_include_usage
    endpoints:
      api:
        base_url: ${ARK_BASE_URL}
        auth_header: authorization_bearer
        responses_api: native
        responses_unsupported_tool_types: [custom]
        keys:
          - id: volcengine_ark_1
            value: ${ARK_API_KEY}

  agnes:
    type: openai_compatible
    stream_usage_mode: openai_include_usage
    endpoints:
      api:
        base_url: ${AGNES_BASE_URL}
        auth_header: authorization_bearer
        keys:
          - id: agnes_1
            value: ${AGNES_API_KEY}

  openrouter:
    type: openai_compatible
    stream_usage_mode: no_option_usage_chunk
    endpoints:
      api:
        base_url: ${OPENROUTER_BASE_URL}
        auth_header: authorization_bearer
        responses_api: native
        keys:
          - id: openrouter_1
            value: ${OPENROUTER_API_KEY}
          - id: openrouter_2
            value: ${OPENROUTER_API_KEY_2}

model_instances:
  - name: ${MIMO_TOKEN_PLAN_MODEL}
    provider: xiaomi_mimo
    endpoint: token_plan
    level: 1
    max_concurrency: 2
    keys:
      - key_id: mimo_token_plan
        daily_quota: 50000000
        priority: 10
    groups: [coding, general]

  - name: ${ARK_MODEL}
    provider: volcengine_ark
    endpoint: api
    level: 2
    max_concurrency: 4
    keys:
      - key_id: volcengine_ark_1
        daily_quota: 50000000
        priority: 20
    groups: [general, coding, fallback]
    unsupported_response_format_types: []

  - name: ${AGNES_MODEL}
    provider: agnes
    endpoint: api
    level: 4
    max_concurrency: 2
    keys:
      - key_id: agnes_1
        daily_quota: 5000000
        priority: 90
    groups: [general, coding, fallback, free]

  - name: ${OPENROUTER_FREE_MODEL}
    provider: openrouter
    endpoint: api
    level: 5
    max_concurrency: 2
    keys:
      - key_id: openrouter_1
        daily_quota: 5000000
        daily_request_quota: 50
        priority: 100
      - key_id: openrouter_2
        daily_quota: 5000000
        daily_request_quota: 50
        priority: 110
    groups: [general, coding, fallback, free]
